openapi: 3.0.3
info:
  title: Subscribers Sync API
  version: 1.0.0
  description: API contract for the subscribers-sync job. Authentication via Bearer token in Authorization header.
servers:
  - url: https://api.third-party.example
paths:
  /:
    get:
      summary: List subscribers (paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscriber'
                  next_page:
                    type: integer
                    nullable: true
                  total_pages:
                    type: integer
                required: [results]
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - missing/invalid Authorization header (Bearer token)
        '429':
          description: Too Many Requests
        '500':
          description: Server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Subscriber:
      type: object
      required:
        - subscriber_id
        - circuit_id
      properties:
        subscriber_id:
          type: string
          description: Unique identifier for subscriber (client will use this as primary key)
        subscriber_name:
          type: string
          nullable: true
        circuit_id:
          type: string
          description: Circuit identifier (e.g., CRT2511009110)
      additionalProperties: true
security:
  - bearerAuth: []
